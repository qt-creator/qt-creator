type: Group
instructions:
  - type: Group
    instructions:
      - type: EnvironmentVariable
        variableName: QTC_QT_BASE_PREFIX
        variableValue: "https://ci-files02-hki.ci.qt.io/packages/jenkins/"
      - type: SetBuildDirectory
        directory: "{{.AgentWorkingDir}}/build"
      - type: MakeDirectory
        directory: "{{.BuildDir}}"
      - type: EnvironmentVariable
        variableName: QTC_BUILD_TYPE
        variableValue: "RelWithDebInfo"
      - type: EnvironmentVariable
        variableName: LLVM_BASE_URL
        variableValue: https://ci-files02-hki.ci.qt.io/packages/jenkins/qtcreator_libclang/libclang-release_23.1.1-based
      - type: EnvironmentVariable
        variableName: GOFLAGS
        variableValue: "-buildvcs=false"
      - type: EnvironmentVariable
        variableName: QTC_QT_BASE_POSTFIX
        variableValue: "/release_content/"
      - type: Group
        enable_if:
          condition: property
          property: features
          not_contains_value: DisableTests
        instructions:
          - type: EnvironmentVariable
            variableName: QTC_TEST_OPTION
            variableValue: "--with-tests"

      - !include "{{qt-creator/qt-creator}}/environment_sdktool.yaml"

      - type: Group
        enable_if:
          condition: property
          property: features
          not_contains_value: "OldestQt"
        instructions:
          - !include "{{qt-creator/qt-creator}}/environment_qt.yaml"

      - type: Group
        enable_if:
          condition: property
          property: features
          contains_value: "OldestQt"
        instructions:
          - !include "{{qt-creator/qt-creator}}/environment_oldestqt.yaml"

      - type: Group
        enable_if:
          condition: property
          property: target.os
          equals_value: Windows
        instructions:
          - type: EnvironmentVariable
            variableName: PYTHON_EXECUTABLE
            variableValue: "python"
          - type: PrependToEnvironmentVariable
            variableName: PATH
            variableValue: "{{.Env.PYTHON3_PATH}};{{.Env.PIP3_PATH}};{{.Env.CI_JOM_PATH}};C:\\Utils\\gnuwin21\\bin;{{.InstallDir}}\\bin;C:\\Utils\\gnuwin32\\bin;"
          - type: Group
            enable_if:
              condition: property
              property: target.arch
              equals_value: X86_64
            instructions:
              - type: EnvironmentVariable
                variableName: QTC_LLVM_POSTFIX
                variableValue: "-windows-vs2022_64.7z"
              - type: EnvironmentVariable
                variableName: QTC_PYTHON_PACKAGE
                variableValue: "Python311-win-x64"
              - type: EnvironmentVariable
                variableName: QTC_ELFUTILS_URL
                variableValue: "https://master.qt.io/development_releases/prebuilt/elfutils/elfutils-release_0.175qt-windows-x86_64.7z"
          - type: Group
            enable_if:
              condition: property
              property: target.arch
              equals_value: AARCH64
            instructions:
              - type: EnvironmentVariable
                variableName: QTC_LLVM_POSTFIX
                variableValue: "-windows-vs2022_arm64.7z"
              - type: EnvironmentVariable
                variableName: QTC_PYTHON_PACKAGE
                variableValue: "Python311-win-arm64"

      - type: Group
        enable_if:
          condition: property
          property: target.os
          equals_value: Linux
        instructions:
          - type: EnvironmentVariable
            variableName: LANG
            variableValue: en_US.UTF-8
          - type: EnvironmentVariable
            variableName: PYTHON_EXECUTABLE
            variableValue: "python3"
          - type: PrependToEnvironmentVariable
            variableName: PATH
            variableValue: "{{.InstallDir}}/bin:"
          - type: EnvironmentVariable
            variableName: DISPLAY
            variableValue: ":0"
          - type: PrependToEnvironmentVariable
            variableName: PATH
            variableValue: "/opt/rh/devtoolset-7/root/usr/bin:"
          - type: Group
            enable_if:
              condition: property
              property: target.arch
              equals_value: X86_64
            instructions:
              - type: EnvironmentVariable
                variableName: QTC_ELFUTILS_URL
                variableValue: "https://master.qt.io/development_releases/prebuilt/elfutils/elfutils-release_0.175qt-linux-x86_64.7z"
              - type: EnvironmentVariable
                variableName: QTC_LLVM_POSTFIX
                variableValue: "-linux-Rhel9.6-gcc11.4-x86_64.7z"
              # RHEL 8.10 comes with Python 3.6, we need explicitly python3.11
              - type: EnvironmentVariable
                variableName: PYTHON_EXECUTABLE
                variableValue: "python3.11"
                enable_if:
                  condition: property
                  property: host.osVersion
                  equals_value: "RHEL_8_10"
          - type: Group
            enable_if:
              condition: property
              property: target.arch
              equals_value: AARCH64
            instructions:
              - type: EnvironmentVariable
                variableName: QTC_ELFUTILS_URL
                variableValue: "https://master.qt.io/development_releases/prebuilt/elfutils/elfutils-release_0.175qt-linux-arm64.7z"
              - type: EnvironmentVariable
                variableName: QTC_LLVM_POSTFIX
                variableValue: "-linux-Ubuntu24.04-gcc13.2-arm64.7z"

      - type: Group
        enable_if:
          condition: property
          property: target.os
          equals_value: MacOS
        instructions:
          - type: EnvironmentVariable
            variableName: LANG
            variableValue: en_US.UTF-8
          - type: EnvironmentVariable
            variableName: QTC_LLVM_POSTFIX
            variableValue: "-macos-universal.7z"
          - type: EnvironmentVariable
            variableName: PYTHON_EXECUTABLE
            variableValue: "python3"
      - type: Group
        enable_if:
          condition: property
          property: features
          contains_value: Sccache
        instructions:
          - type: EnvironmentVariable
            variableName: QTC_SCCACHE_C_OPTION
            variableValue: --add-config=-DCMAKE_C_COMPILER_LAUNCHER=sccache
          - type: EnvironmentVariable
            variableName: QTC_SCCACHE_CXX_OPTION
            variableValue: --add-config=-DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          - type: EnvironmentVariable
            variableName: QTC_SCCACHE_ENABLE_OPTION
            variableValue: --add-config=-DWITH_SCCACHE_SUPPORT=ON
